name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Validates. Never publishes, never touches deployed state.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rustup honors rust-toolchain.toml, so the pinned version is installed
      # on the first cargo invocation. No separate toolchain pin to drift.
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Infra typecheck
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit

      # The core crates own the domain and the rendering; the handlers own the
      # edge. That layering is a doc comment until something enforces it, and
      # the thing it buys is a real option: neither crate pulls a dependency
      # that cannot compile to wasm32, so moving rendering or checking into
      # the browser stays possible. An aws-sdk in either one closes that door
      # silently.
      - name: Core crates stay portable
        run: |
          ! cargo tree -p resume-core -e normal | grep -qE 'aws-sdk-|lambda_'
          ! cargo tree -p gen-ai-core -e normal | grep -qE 'aws-sdk-|lambda_'

      # The GenAI lab worker is JS-generating-Python-in-a-worker that no Rust
      # test can exercise: it only fails at runtime under Pyodide. This vendors
      # the runtime and runs the shipped worker.js intercept end to end — the
      # call runs through the intercept, completion resolves against live
      # boto3, a wrong call raises a real exception. It catches the class of
      # runtime bug (ssl, credentials, install path, intercept keying, response
      # stream) that otherwise surfaces only in a browser. Vendoring fetches
      # from the Pyodide CDN and PyPI; the pins make it reproducible.
      - name: GenAI workbench smoke test
        run: |
          node assets/gen-ai/vendor-pyodide.mjs
          node assets/gen-ai/smoke-test.mjs

      # The architecture document's own invariants (schema version, unique
      # ids, no placeholders, well-formed CloudFormation types) are covered by
      # `cargo test` above. Cross-checking it against the real stacks needs a
      # cloud assembly, which needs every Rust binary built, so that half runs
      # in the deploy job where the build is already being paid for. A wrong
      # diagram therefore blocks a deploy rather than a pull request.

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write # OIDC. No long-lived AWS keys anywhere.
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-lambda
        run: pipx install cargo-lambda

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy
        working-directory: infra
        env:
          # Baked into the binary for provenance and derived values. cargo
          # rebuilds on change because build.rs declares these as triggers.
          GIT_SHA: ${{ github.sha }}
          SITE_URL: https://rader-resume.com
        run: |
          export BUILD_MONTH="$(date -u +%Y-%m)"
          npm ci

          # Vendor the Pyodide runtime and the lab's wheels onto disk before
          # synth. The lab's asset bucket deployment reads
          # assets/gen-ai/pyodide/ at synth time, and the binaries are
          # gitignored, so this is where they are produced. Fetches from the
          # Pyodide CDN and PyPI once per run; the pinned version and the
          # committed WHEELS list plus lockfile are what make it reproducible.
          # Run from the repo root, not infra/.
          node ../assets/gen-ai/vendor-pyodide.mjs

          # Synthesize once, then deploy from that assembly. The architecture
          # check needs a real assembly to compare against, and synthesizing
          # twice means building every Rust binary twice.
          #
          # The certificate stack is in us-east-1 and the site stack depends on
          # it, so CDK orders them. Both are named to keep bootstrap stacks out.
          npx cdk synth rader-resume-cert rader-resume-dev \
            --context stage=dev --quiet

          # A diagram that claims a service this stack does not run never
          # reaches the live site.
          npm run check:architecture

          npx cdk deploy rader-resume-cert rader-resume-dev \
            --app cdk.out --require-approval never
