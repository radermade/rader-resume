[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
resume-core = { path = "crates/resume-core" }

axum = "0.8"
# 1.x relaxed `run`'s error bound to any `E: Debug + Into<Diagnostic>`. The 0.5
# line required `Error = lambda_http::Error`, which an axum Router
# (Error = Infallible) cannot satisfy. Do not downgrade below 1.x.
lambda_http = "1.3"
lambda_runtime = "1.5"
maud = "0.27"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
codegen-units = 1
strip = true
