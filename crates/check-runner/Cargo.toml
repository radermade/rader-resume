[package]
name = "check-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
resume-core = { workspace = true }

reqwest = { workspace = true }
serde = { workspace = true }
# Only for the backoff sleep between attempts. Declared explicitly rather
# than relying on reqwest enabling the feature, because feature unification
# is not a contract.
tokio = { workspace = true, features = ["time"] }
